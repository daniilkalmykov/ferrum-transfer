[package]
name = "ferrum-transfer"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
bytes = "1.12.1"
async-trait = "0.1.92"
sha2 = "0.11.1"
chrono = "0.4"
uuid = { version = "1.11", features = ["v4"] }
